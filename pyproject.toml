[project]
name = "capcut-mcp"
version = "0.1.0"
description = "MCP server for reading and editing local CapCut drafts, with an ffmpeg verification loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Henri88", email = "lh882220@gmail.com" },
]
keywords = ["mcp", "capcut", "video-editing", "claude", "llm-agent"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mcp>=2.0.0",
]

[project.urls]
Repository = "https://github.com/REPLACE_ME/capcut-mcp"

[project.scripts]
capcut-mcp = "capcut_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capcut_mcp"]
